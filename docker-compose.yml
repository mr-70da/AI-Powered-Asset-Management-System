# KINANA - AI-Powered Asset Management System
# Brings up SQL Server and Redis with a single command:
#   docker compose up -d
#
# SQL Server: listens on localhost:1433 (sa password from .env, default in .env.example).
#   Create the database and run the scripts in database/scripts/ in order (see README).
# Redis:      listens on localhost:6379, no persistence (dev).

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kasm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - kasm-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: kasm-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kasm-sql-data:
